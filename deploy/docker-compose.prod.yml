version: '3.8'

services:
  ai-lesson-builder:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    image: ai-lesson-builder:latest
    container_name: ai-lesson-builder
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      # Override specific settings for production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - ai-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: ai-lesson-builder-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ai-lesson-builder
    restart: always
    profiles:
      - with-nginx
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge
